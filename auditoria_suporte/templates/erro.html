{% extends "base.html" %}
{% block titulo %}Erro {{ codigo }} | {{ sistema_nome }}{% endblock %}
{% block pagina_titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="cartao">
  <div class="erro-pagina">
    <span class="erro-codigo">{{ codigo }}</span>
    <h2>{{ titulo }}</h2>
    <p>{{ mensagem }}</p>
    <a class="btn btn-primario" href="{{ url_for('dashboard.index') }}">Voltar ao dashboard</a>
  </div>
</div>
{% endblock %}
